[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citizensolver"
version = "0.1.0"
description = "Independent Star Citizen loadout search and analysis"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
citizensolver = "citizensolver.cli:main"

[tool.setuptools.packages.find]
include = ["citizensolver*"]

[tool.setuptools.package-data]
citizensolver = ["static/*"]
