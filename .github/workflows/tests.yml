name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -q --durations 10
      - run: python -m compileall -q citizensolver tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check citizensolver/static/app.js
      - run: node tests/test_priorities.js
